[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "star-protocol"
version = "0.2.0"
description = "Python SDK for Star Protocol - Multi-Agent Communication over WebSocket"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "starlette>=1.0.0", # For Hub
    "websockets>=16.0", # For Client
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.135.3",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/star_protocol"]
